[package]
name = "steel-parser"
version = "0.8.3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["mattwparas <matthewparas2020@u.northwestern.edu>"]
repository = "https://github.com/mattwparas/steel"
description = "Parser for use within steel"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rustc-hash = { version = "2.1.1", default-features = false }
lasso = { version = "0.7.3", features = ["multi-threaded", "ahash", "serialize", "inline-more"] }
num-rational = { version = "0.4.2", default-features = false, features = ["serde", "num-bigint"] }
num-traits = { version = "0.2.19", default-features = false }
num-bigint = { version = "0.4.6", default-features = false, features = ["serde"] }
once_cell = "1.18.0"
serde = { version = "1.0.152", default-features = false, features = ["derive", "rc", "alloc"] }
smallvec = "1.13"
compact_str = { version = "0.8.0", default-features = false }
log = "0.4.17"
thin-vec = { version = "0.2.14", default-features = false, features = ["serde"] }
dashmap = "6.1.0"
unicode-width = "0.2"
ordered-float = { version = "5.1.0", default-features = false, features = ["serde"] }

[features]
default = ["std"]
std = [
    "rustc-hash/std",
    "num-rational/std",
    "num-traits/std",
    "num-bigint/std",
    "serde/std",
    "compact_str/std",
    "thin-vec/std",
    "ordered-float/std",
]

[dev-dependencies]
pretty_assertions = "1.4" # Only used by unit tests.
proptest = "1.1.0" # Only used by property tests.
