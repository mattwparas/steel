[package]
name = "steel-repl"
version.workspace = true
authors = ["mattwparas <matthewparas2020@u.northwestern.edu>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mattwparas/steel"
description = "REPL library for steel"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
colored = "3.0.0"
# Only what the REPL needs; whatever builds it (the steel binary, a Hermit
# runner) picks the rest: jit2, dylibs, stacker, markdown, ...
steel-core = { path = "../steel-core", version = "0.8.3", features = ["sync"] }
steel-parser = { path = "../steel-parser", version = "0.8.3" }
env_home = "0.1.0"
unicode-width = "0.2"
unicode-segmentation = "1.12"

# The terminal layer (src/terminal.rs)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[features]
interrupt = ["steel-core/interrupt"]
